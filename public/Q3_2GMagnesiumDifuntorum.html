<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q3 2nd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="AL Mendoza">
    <title>Graded Exercise 2</title>
    <!-- updated external css link to show how to share it between repository -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../Q3_2GMagnesiumDifuntorum.css" />
    <link rel="icon" href="../assets/pshslogo.png" sizes="32x32" type="image/png">
    <script src="script.js" defer></script>
   <style>
    body{
        padding: 25px;
        font-family: arial;
        width: 80%;
        margin-left: 10%;
        }

        .title {
            color: #5C6AC4;
        }

        fieldset:nth-child(2) {
             margin-top: 20px;
        }

        legend {
            background: black;
            color: yellow;
            padding: 5px;
        }
        label {
             margin: 5%;
        }
    </style>
  </head>
  <body>
     <header>
        <div>
            <img src="../../assets/pshslogo.png" alt="pshs logo" 
               title="The Official Logo" width="50px" height="50px" />
            <h1>
                Sample Use of HTML Form    
            </h1>
            <h3>by CJ Difuntorum </h3>
        </div>
        <nav class="navbar">
            <a href="../../index.html"> Home </a>
            <a href="registered.html"> Show Saved Accounts </a>
        </nav>
    </header>
    <section>
      <h1 class="title">Sign-up Page</h1>
      <form id="dForm" action="registered.html" method="get">
        <fieldset>
          <legend>Your Credentials</legend><br/>
          <label> StudentID: 
            <input type="number" name="id" id="id" required />
          </label><br/><br/>

          <label> Full Name:
            <input type="text" name="name" id="name" required />
          </label><br/><br/>

          <label> Birthday:
            <input type="date" name="bday" id="bday" />
          </label><br/><br/>

          <label> Email Adress:
            <input type="email" name="email" id="email" />
          </label><br/><br/>

          <label> Mobile Phone:
            <input type="text" name="phone" id="phone" />
          </label><br/><br/>

          <label> Grade Level: </label>
            <select name="glvl" id="glvl" required>
                <option value=""> Select your Grade Level </option>
                <option value="n07">7</option>
                <option value="g08">8</option>
                <option value="g09">9</option>
                <option value="g10">10</option>
                <option value="g11">11</option>
                <option value="g12">12</option>
            </select>
          <br/><br/>

          <label> Intern/Extern :
            <input type="radio" name="gender" value="Female" /> Intern
            <input type="radio" name="gender" value="Male" /> Extern
          </label><br/><br/>

          <label> Preferred Organization / Club: </label>
            <select name="club" id="club" required>
              <option value=""> Select your Preferred Club </option>
              <option value="c01">Club 1</option>
              <option value="c02">Club 2</option>
              <option value="c03">Club 3</option>
              <option value="c04">Club 4</option>
              <option value="c05">Club 5</option>
            </select>
          <br/><br/>

          <label> Why do you want to join?
            <textarea name="reason" id="reason">
              
            </textarea>
          </label><br/><br/>
        </fieldset>

        <fieldset>
          <legend>Action Buttons</legend>
          <button type="submit"> Accept </button>
          <input type="reset" value="Clear" />
        </fieldset> 
      </form>
    </section>
    <script src="Q3_2GMagnesiumDifuntorum.js"></script>
  </body>
</html>

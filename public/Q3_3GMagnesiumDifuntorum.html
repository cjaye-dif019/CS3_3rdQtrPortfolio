<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q3 3nd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="CJ Difuntorum">
    <title>Graded Exercise 3</title>
    <!-- updated external css link to show how to share it between repository -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="../assets/fish.png" sizes="32x32" type="image/png">
    <style>
      body{
        background: linear-gradient(to right, #6a11cb, #2575fc); 
        color: #fff;
        padding: 25px;
        font-family: arial;
        margin: 0 auto;
        box-sizing: border-box;
      }

      header {
        display: flex;
        flex-wrap: wrap; 
        align-items: center;
        justify-content: space-between;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      header div {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      header img {
        margin-bottom: 10px;
      }

      header h1 {
        color: #fff;
        margin: 0;
        font-size: 1.5em;
      }

      header h3 {
        color: #ddd;
        margin: 5px 0 0 0;
        font-weight: normal;
      }

      .navbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px; 
        margin-top: 10px;
      }

      .navbar a {
        color: #fff;
        padding: 10px;
        margin: 0 15px;
        text-decoration: none;
        font-size: 18px;
        background: #4CAF50;
        border-radius: 5px;
        transition: background 0.3s ease;
      }

      .navbar a:hover {
        background: #45a049;
      }

      .title {
        color: #5C6AC4;
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
      }

      fieldset {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }

      label {
        font-size: 16px;
        margin: 10px 0;
        display: block;
      }

      input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
        width: 100%;
        padding: 12px;
        margin: 5px 0;
        border-radius: 5px;
        box-sizing: border-box;
      }

      input:focus, select:focus, textarea:focus {
        background-color: rgba(240, 238, 238, 0.914); 
        border-color: #6a11cb; 
      }

      input, select, textarea {
        border: 1px solid #2a2a2a;
        outline: none;             
        box-sizing: border-box;      
      }

      textarea {
        width: 100%;
        height: 150px;
        resize: vertical;
        padding: 15px;
        border: 1px solid #2a2a2a;
      }

      button, input[type="reset"] {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover, input[type="reset"]:hover {
        background-color: #45a049;
      }

      .title {
        color: #fff;
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
      }

      @media (max-width: 768px) {
        body {
          width: 95%;
          padding: 10px;
        }

        header {
          flex-direction: column;
          align-items: flex-start;
        }

  
        header div {
          align-items: flex-start; 
        }

        .navbar {
          justify-content: flex-start;
          width: 100%;
        }

        .navbar a {
          font-size: 16px;
          margin: 0 10px;
        }
      }
    </style>
  </head>


  <body>
    <header>
      <div>
        <img src="../assets/fish.png" alt="pshs logo" 
        title="The Official Logo" width="50px" height="50px" />
        <h1>
          Centralized Club/Organization Application Form    
        </h1>
        <h3>by CJ Difuntorum</h3>
      </div>
      <nav class="navbar">
        <a href="../index.html"> Home </a>
        <a href="../public/viewSignUps.html"> View SignUps </a>
      </nav>
    </header>

    <h1 class="title">Sign Up Now!</h1>

    <form id="dForm" onsubmit="return submit_()" onreset="return reset_()">
        <!-- Personal Information Fieldset -->
        <fieldset>
            <legend>Personal Information</legend>

            <label>Student ID
                <input type="number" name="ID" required
                onfocus="focusInput(this)" onblur="blurInput(this)">
            </label>

            <label>Full Name
                <input type="text" name="Name" required
                onfocus="focusInput(this)" onblur="blurInput(this)">
            </label>

            <label>Birthday
                <input type="date" name="BDay" required
                onfocus="focusInput(this)" onblur="blurInput(this)">
            </label>

            <label>Email Address
                <input type="email" name="Email" required
                onfocus="focusInput(this)" onblur="blurInput(this)">
            </label>

            <label>Mobile Phone
                <input type="text" name="Phone" required
                 onfocus="focusInput(this)" onblur="blurInput(this)">
            </label>
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>

            <label>Grade Level
                <select name="Grade" required
                    onfocus="focusInput(this)" onblur="blurInput(this)">
                    <option value="">Select your Grade Level</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </label>

            <label>Intern / Extern:
                <input type="radio" name="Home" value="Intern" required> Intern
                <input type="radio" name="Home" value="Extern"> Extern
            </label>

            <label>Preferred Club
                <select name="Club" required
                    onfocus="focusInput(this)" onblur="blurInput(this)">
                    <option value="">Select your Preferred Club</option>
                    <option value="Ang Lagablab">Ang Lagablab</option>
                    <option value="Flux">Flux</option>
                    <option value="Himig Agham">Himig Agham</option>
                    <option value="Invictus">Invictus</option>
                    <option value="The Science Scholar">The Science Scholar</option>
                </select>
            </label>

            <label>Why do you want to join?
                <textarea name="Reason" required
                onfocus="focusInput(this)" onblur="blurInput(this)"></textarea>
            </label>
        </fieldset>

        <fieldset>
            <legend>Action Buttons</legend>
            <button type="submit">Accept</button>
            <input type="reset" value="Clear">
        </fieldset>

    </form>

    <script>
      /* Confirmation Buttons */
      function submit_() {
        return confirm("Are you sure you want to submit the form?");
      }

      function reset_() {
         return confirm("Are you sure you want to reset the form?");
      }

      /* Input/Output Effects */
      function focusInput(art) {
          art.style.background = "#d8cfff";
          art.style.border = "2px solid #6a11cb";
      }

      function blurInput(art) {
        art.style.background = "#f1f1f1";

        if (art.value.trim() == "") {
          art.style.border = "2px solid red";
        }   

        else  {
          art.style.border = "1px solid #2575fc";
        }
      }

      /* ===== LOCAL STORAGE ===== */
      let acctString = localStorage.getItem("accounts");
      let accountList = acctString ? JSON.parse(acctString) : {};

      const form = document.getElementById("dForm");

      form.addEventListener("submit", function(e) {
      e.preventDefault(); // stop page reload

      const data = new FormData(form);
      const obj = Object.fromEntries(data.entries());

      accountList[obj.ID] = obj; // use Student ID as key

      localStorage.setItem("accounts", JSON.stringify(accountList));
        alert("Signup saved successfully!");
      });
    </script>
  </body>
</html>
